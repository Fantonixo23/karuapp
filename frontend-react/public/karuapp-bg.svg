<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="base" cx="70%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#221812"/>
      <stop offset="38%" stop-color="#150f0b"/>
      <stop offset="70%" stop-color="#0c0907"/>
      <stop offset="100%" stop-color="#060403"/>
    </radialGradient>

    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4436" stop-opacity="0.85"/>
      <stop offset="32%" stop-color="#E53935" stop-opacity="0.45"/>
      <stop offset="68%" stop-color="#8E1B17" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8E1B17" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="redCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A5C" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#E53935" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E53935" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="redEdge" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#E53935" stop-opacity="0.34"/>
      <stop offset="12%" stop-color="#B71C1C" stop-opacity="0.12"/>
      <stop offset="30%" stop-color="#B71C1C" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dome" cx="37%" cy="16%" r="88%">
      <stop offset="0%" stop-color="#efe6d8"/>
      <stop offset="10%" stop-color="#cfc4b4"/>
      <stop offset="26%" stop-color="#9a8f80"/>
      <stop offset="45%" stop-color="#5d554a"/>
      <stop offset="64%" stop-color="#332d27"/>
      <stop offset="82%" stop-color="#1b1713"/>
      <stop offset="100%" stop-color="#0d0a08"/>
    </radialGradient>

    <linearGradient id="domeRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E53935" stop-opacity="0"/>
      <stop offset="62%" stop-color="#E53935" stop-opacity="0.12"/>
      <stop offset="88%" stop-color="#FF6A5C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF8A7A" stop-opacity="0.72"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a89c8c"/>
      <stop offset="16%" stop-color="#6c6255"/>
      <stop offset="42%" stop-color="#332d27"/>
      <stop offset="72%" stop-color="#17130f"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>

    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d7265"/>
      <stop offset="22%" stop-color="#4a4239"/>
      <stop offset="55%" stop-color="#241f1a"/>
      <stop offset="100%" stop-color="#0b0907"/>
    </linearGradient>

    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0706" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0a0706" stop-opacity="0.55"/>
      <stop offset="72%" stop-color="#070504" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050403" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="vignette" cx="58%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="82%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>

    <filter id="blurXL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="150"/>
    </filter>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="blurM" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="steam" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#base)"/>

  <!-- Ambiente rojo dramático (lado derecho) -->
  <ellipse cx="3310" cy="960" rx="1180" ry="900" fill="url(#redGlow)" filter="url(#blurXL)" opacity="0.62"/>
  <ellipse cx="3400" cy="860" rx="520" ry="430" fill="url(#redCore)" filter="url(#blurL)" opacity="0.7"/>
  <rect x="3060" y="0" width="780" height="2160" fill="url(#redEdge)" filter="url(#blurL)"/>

  <!-- Bokeh / luces desenfocadas -->
  <circle cx="3520" cy="560" r="58" fill="#FF6A5C" opacity="0.12" filter="url(#blurM)"/>
  <circle cx="3660" cy="820" r="38" fill="#E53935" opacity="0.14" filter="url(#blurM)"/>
  <circle cx="3440" cy="1160" r="72" fill="#B71C1C" opacity="0.14" filter="url(#blurL)"/>
  <circle cx="3750" cy="1320" r="46" fill="#FF8A7A" opacity="0.1" filter="url(#blurM)"/>
  <circle cx="3200" cy="520" r="26" fill="#F59E0B" opacity="0.08" filter="url(#blurM)"/>
  <circle cx="3600" cy="1640" r="60" fill="#E53935" opacity="0.1" filter="url(#blurL)"/>

  <!-- Superficie / mesa -->
  <rect x="0" y="1380" width="3840" height="780" fill="url(#surface)"/>
  <ellipse cx="3020" cy="1706" rx="680" ry="110" fill="#000000" opacity="0.65" filter="url(#blurM)"/>
  <ellipse cx="3300" cy="1712" rx="330" ry="64" fill="#E53935" opacity="0.13" filter="url(#blurL)"/>

  <!-- Bandeja metálica -->
  <ellipse cx="3020" cy="1682" rx="556" ry="76" fill="url(#tray)"/>
  <ellipse cx="3020" cy="1676" rx="556" ry="72" fill="none" stroke="#b9ab99" stroke-opacity="0.32" stroke-width="3"/>
  <ellipse cx="3020" cy="1672" rx="500" ry="58" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="8"/>
  <ellipse cx="3020" cy="1692" rx="588" ry="80" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="14" filter="url(#blurS)"/>

  <!-- Campana metálica (cloche) -->
  <path d="M2570 1668 C2570 1330 3470 1330 3470 1668 C3470 1684 2570 1684 2570 1668 Z" fill="url(#dome)"/>
  <path d="M2570 1668 C2570 1330 3470 1330 3470 1668 C3470 1684 2570 1684 2570 1668 Z" fill="url(#domeRed)" opacity="0.85"/>

  <!-- Reflejo especular frontal -->
  <path d="M2700 1618 C2718 1452 2872 1378 3010 1356" fill="none" stroke="#fff7ea" stroke-opacity="0.38" stroke-width="16" stroke-linecap="round" filter="url(#blurS)"/>
  <path d="M2782 1636 C2790 1528 2890 1458 2988 1432" fill="none" stroke="#fff7ea" stroke-opacity="0.16" stroke-width="8" stroke-linecap="round" filter="url(#blurS)"/>
  <!-- Borde de luz roja en el costado derecho -->
  <path d="M3414 1652 C3418 1478 3318 1392 3204 1362" fill="none" stroke="#FF6A5C" stroke-opacity="0.55" stroke-width="18" stroke-linecap="round" filter="url(#blurM)"/>
  <path d="M3390 1660 C3388 1520 3300 1430 3210 1396" fill="none" stroke="#FF8A7A" stroke-opacity="0.4" stroke-width="7" stroke-linecap="round" filter="url(#blurS)"/>

  <!-- Asa / pomo -->
  <rect x="2968" y="1288" width="104" height="150" rx="30" fill="url(#metal)"/>
  <path d="M2982 1304 L2982 1408" stroke="#fff7ea" stroke-opacity="0.3" stroke-width="8" stroke-linecap="round" filter="url(#blurS)"/>
  <ellipse cx="3020" cy="1294" rx="86" ry="26" fill="url(#tray)"/>
  <ellipse cx="3020" cy="1290" rx="86" ry="24" fill="none" stroke="#d9cdbb" stroke-opacity="0.4" stroke-width="3"/>
  <ellipse cx="3020" cy="1292" rx="52" ry="14" fill="#171310"/>
  <ellipse cx="3006" cy="1278" rx="20" ry="7" fill="#fff7ea" opacity="0.35" filter="url(#blurS)"/>
  <ellipse cx="3240" cy="1368" rx="34" ry="12" fill="#FF6A5C" opacity="0.28" filter="url(#blurS)"/>

  <!-- Vapor tenue -->
  <path d="M2996 1264 C2950 1180 3028 1132 2984 1046 C2952 986 2998 946 2986 900" fill="none" stroke="#f3efe7" stroke-opacity="0.16" stroke-width="12" stroke-linecap="round" filter="url(#steam)"/>
  <path d="M3038 1252 C3082 1182 3006 1130 3048 1052 C3080 990 3030 942 3052 892" fill="none" stroke="#f3efe7" stroke-opacity="0.13" stroke-width="10" stroke-linecap="round" filter="url(#steam)"/>
  <path d="M3014 1238 C3002 1172 3050 1138 3024 1072" fill="none" stroke="#f3efe7" stroke-opacity="0.09" stroke-width="8" stroke-linecap="round" filter="url(#steam)"/>
  <path d="M3064 1276 C3108 1216 3054 1168 3082 1104" fill="none" stroke="#f3efe7" stroke-opacity="0.08" stroke-width="8" stroke-linecap="round" filter="url(#steam)"/>

  <!-- Polvo ambiental -->
  <g fill="#f3efe7" opacity="0.14">
    <circle cx="2860" cy="1040" r="2.5"/>
    <circle cx="3120" cy="980" r="2"/>
    <circle cx="3186" cy="1150" r="2.6"/>
    <circle cx="2920" cy="1210" r="1.8"/>
    <circle cx="3300" cy="1240" r="2.2"/>
    <circle cx="2750" cy="960" r="1.6"/>
    <circle cx="3240" cy="860" r="1.8"/>
  </g>
  <g fill="#E53935" opacity="0.22">
    <circle cx="3380" cy="1040" r="2.6"/>
    <circle cx="3460" cy="900" r="2"/>
    <circle cx="3520" cy="1180" r="3"/>
    <circle cx="3260" cy="720" r="2"/>
  </g>

  <!-- Viñeta cinematográfica -->
  <rect width="3840" height="2160" fill="url(#vignette)"/>
  <rect width="3840" height="2160" filter="url(#grain)" opacity="0.05"/>
</svg>
