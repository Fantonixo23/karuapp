  <body>
    <div id="root"></div>
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var slug = params.get('restaurante');
        if (slug) {
          document.cookie = 'restaurante=' + encodeURIComponent(slug) + '; path=/; max-age=86400';
        } else {
          var cookies = document.cookie.split('; ');
          for (var i = 0; i < cookies.length; i++) {
            var parts = cookies[i].split('=');
            if (parts[0] === 'restaurante' && parts[1]) {
              var sep = window.location.search ? '&' : '?';
              window.history.replaceState(null, '', window.location.pathname + sep + 'restaurante=' + parts[1] + window.location.hash);
              break;
            }
          }
        }
      })();
    </script>
  </body>
