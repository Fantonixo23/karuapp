<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
window.__KARU_USER__ = {
  {% if user.is_authenticated %}
  email: "{{ user.email|escapejs }}",
  name: "{{ user.get_full_name|default:user.username|escapejs }}",
  rol: "{{ usuario.rol|default:'administrador'|escapejs }}"
  {% else %}
  email: null,
  name: null,
  rol: null
  {% endif %}
};
</script>
{% include "index.html" %}
</body>
</html>
