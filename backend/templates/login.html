<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>karuAPP - Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { width: 100%; max-width: 420px; padding: 20px; }
.card { background: #1e293b; border-radius: 16px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
.logo { text-align: center; margin-bottom: 32px; }
.logo h1 { color: #f8fafc; font-size: 24px; font-weight: 700; }
.logo span { color: #f97316; }
.tabs { display: flex; gap: 4px; background: #0f172a; border-radius: 10px; padding: 4px; margin-bottom: 24px; }
.tab { flex: 1; text-align: center; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px; color: #64748b; transition: all .2s; border: none; background: none; }
.tab.active { background: #f97316; color: #fff; }
.form { display: none; flex-direction: column; gap: 16px; }
.form.active { display: flex; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { color: #94a3b8; font-size: 13px; font-weight: 500; }
.form-group input { padding: 12px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #f8fafc; font-size: 14px; outline: none; transition: border .2s; }
.form-group input:focus { border-color: #f97316; }
.form-group input::placeholder { color: #475569; }
.btn { padding: 12px; background: #f97316; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 4px; }
.btn:hover { background: #ea580c; }
.btn:disabled { opacity: .6; cursor: not-allowed; }
.error { background: #7f1d1d; color: #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
.error.show { display: block; }
.success { background: #14532d; color: #86efac; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none; }
.success.show { display: block; }
.spinner { display: none; width: 20px; height: 20px; border: 2px solid #475569; border-top-color: #f97316; border-radius: 50%; animation: spin .6s linear infinite; margin: 0 auto; }
.spinner.show { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="logo"><h1>karu<span>APP</span></h1></div>
<div class="tabs">
<button class="tab active" onclick="switchTab('login')">Iniciar sesión</button>
<button class="tab" onclick="switchTab('register')">Crear cuenta</button>
</div>

<div id="errorMsg" class="error"></div>
<div id="successMsg" class="success"></div>

<form id="loginForm" class="form active" onsubmit="return doLogin(event)">
<div class="form-group">
<label>Email</label>
<input type="email" id="loginEmail" placeholder="tu@email.com" required>
</div>
<div class="form-group">
<label>Contraseña</label>
<input type="password" id="loginPassword" placeholder="••••••••" required>
</div>
<a href="#" onclick="showForgotPassword(); return false;" style="color:#f97316; font-size:13px; text-align:right; display:block; margin-top:-10px; text-decoration:none;">¿Olvidaste tu contraseña?</a>
<button type="submit" class="btn" id="loginBtn">Ingresar</button>
</form>

<form id="registerForm" class="form" onsubmit="return doRegister(event)">
<div class="form-group">
<label>Nombre del restaurante</label>
<input type="text" id="regNombre" placeholder="Ej: Pizzería Juan" required>
</div>
<div class="form-group">
<label>Tu nombre</label>
<input type="text" id="regNombreUser" placeholder="Ej: Juan Pérez" required>
</div>
<div class="form-group">
<label>Email</label>
<input type="email" id="regEmail" placeholder="tu@email.com" required>
</div>
<div class="form-group">
<label>Contraseña</label>
<input type="password" id="regPassword" placeholder="••••••••" required>
</div>
<div class="form-group">
<label>Confirmar contraseña</label>
<input type="password" id="regPassword2" placeholder="••••••••" required>
</div>
<button type="submit" class="btn" id="registerBtn">Crear cuenta</button>
</form>
</div>
</div>

<div id="forgotModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#1e293b; border-radius:16px; padding:32px; max-width:400px; width:90%; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="color:#f8fafc; font-size:18px;">Restablecer contraseña</h2>
      <button onclick="hideForgotPassword()" style="background:none; border:none; color:#64748b; font-size:20px; cursor:pointer;">&times;</button>
    </div>
    <div id="forgotError" class="error" style="margin-bottom:12px;"></div>
    <div id="forgotSuccess" class="success" style="margin-bottom:12px;"></div>
    <div id="forgotStep1">
      <div class="form-group">
        <label>Email registrado</label>
        <input type="email" id="forgotEmail" placeholder="tu@email.com" style="width:100%;">
      </div>
      <button class="btn" onclick="sendResetCode()" id="forgotSendBtn" style="width:100%;">Enviar código</button>
    </div>
    <div id="forgotStep2" style="display:none;">
      <p style="color:#94a3b8; font-size:13px; margin-bottom:12px;">Revisá tu email e ingresá el código de 6 dígitos</p>
      <div class="form-group">
        <label>Código</label>
        <input type="text" id="forgotCode" maxlength="6" placeholder="000000" oninput="this.value=this.value.replace(/\D/g,'').slice(0,6)" style="font-size:24px; text-align:center; letter-spacing:8px; width:100%;">
      </div>
      <button class="btn" onclick="verifyResetCode()" id="forgotVerifyBtn" style="width:100%;">Verificar código</button>
      <button onclick="document.getElementById('forgotCode').value=''; hideForgotError(); showForgotStep(1)" style="display:block; margin:10px auto 0; background:none; border:none; color:#f97316; cursor:pointer; font-size:13px; text-decoration:underline;">Volver</button>
    </div>
    <div id="forgotStep3" style="display:none;">
      <div class="form-group">
        <label>Nueva contraseña</label>
        <input type="password" id="forgotNewPass" placeholder="••••••••" style="width:100%;">
      </div>
      <div class="form-group">
        <label>Confirmar contraseña</label>
        <input type="password" id="forgotNewPass2" placeholder="••••••••" style="width:100%;">
      </div>
      <button class="btn" onclick="resetPassword()" id="forgotResetBtn" style="width:100%;">Cambiar contraseña</button>
    </div>
  </div>
</div>

<script>
var API = '/api';
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.form').forEach(function(f) { f.classList.remove('active'); });
  if (tab === 'login') {
    document.querySelector('.tab:first-child').classList.add('active');
  } else {
    document.querySelector('.tab:last-child').classList.add('active');
  }
  document.getElementById(tab + 'Form').classList.add('active');
  hideError(); hideSuccess();
}
function showError(msg) { var el = document.getElementById('errorMsg'); el.textContent = msg; el.classList.add('show'); }
function hideError() { document.getElementById('errorMsg').classList.remove('show'); }
function showSuccess(msg) { var el = document.getElementById('successMsg'); el.textContent = msg; el.classList.add('show'); }
function hideSuccess() { document.getElementById('successMsg').classList.remove('show'); }
function setLoading(btnId, loading) {
    var btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.textContent = loading ? '' : (btnId === 'loginBtn' ? 'Ingresar' : 'Crear cuenta');
  }
  (function(){
    var p = new URLSearchParams(window.location.search);
    if (p.get('error') === 'bloqueo') {
      showError('Bloqueo del sistema por falta de pago, por favor contacte con el administrador');
    }
  })();
async function doLogin(e) {
  e.preventDefault(); hideError(); hideSuccess();
  var email = document.getElementById('loginEmail').value.trim();
  var password = document.getElementById('loginPassword').value;
  if (!email || !password) { showError('Completá todos los campos'); return false; }
  setLoading('loginBtn', true);
  try {
    var res = await fetch(API + '/auth/login-saas', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: email, password: password}), credentials: 'include'
    });
    var data = await res.json();
    if (data.success) {
      showSuccess('Iniciando sesión...');
      setTimeout(function() { window.location.href = '/app/inicio'; }, 500);
    } else {
      showError(data.error || 'Error al iniciar sesión');
    }
  } catch(e) { showError('Error de conexión'); }
  setLoading('loginBtn', false);
  return false;
}
async function doRegister(e) {
  e.preventDefault(); hideError(); hideSuccess();
  var nombre = document.getElementById('regNombre').value.trim();
  var nombreUser = document.getElementById('regNombreUser').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  var password = document.getElementById('regPassword').value;
  var password2 = document.getElementById('regPassword2').value;
  if (!nombre || !nombreUser || !email || !password) { showError('Completá todos los campos'); return false; }
  if (password !== password2) { showError('Las contraseñas no coinciden'); return false; }
  setLoading('registerBtn', true);
  try {
    var res = await fetch(API + '/auth/register-saas', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({nombre_restaurante: nombre, nombre: nombreUser, email: email, password: password}),
      credentials: 'include'
    });
    var data = await res.json();
    if (data.success) {
      showSuccess('Cuenta creada. Redirigiendo...');
      setTimeout(function() { window.location.href = '/app/inicio'; }, 800);
    } else {
      showError(data.error || 'Error al crear cuenta');
    }
  } catch(e) { showError('Error de conexión'); }
  setLoading('registerBtn', false);
  return false;
}
var _forgotCode = '';
function showForgotPassword() { document.getElementById('forgotModal').style.display = 'flex'; }
function hideForgotPassword() { document.getElementById('forgotModal').style.display = 'none'; hideForgotError(); hideForgotSuccess(); showForgotStep(1); }
function hideForgotError() { var el = document.getElementById('forgotError'); el.classList.remove('show'); el.textContent = ''; }
function showForgotError(msg) { var el = document.getElementById('forgotError'); el.textContent = msg; el.classList.add('show'); }
function hideForgotSuccess() { var el = document.getElementById('forgotSuccess'); el.classList.remove('show'); el.textContent = ''; }
function showForgotSuccess(msg) { var el = document.getElementById('forgotSuccess'); el.textContent = msg; el.classList.add('show'); }
function showForgotStep(n) {
  document.getElementById('forgotStep1').style.display = n===1 ? 'block' : 'none';
  document.getElementById('forgotStep2').style.display = n===2 ? 'block' : 'none';
  document.getElementById('forgotStep3').style.display = n===3 ? 'block' : 'none';
  hideForgotError(); hideForgotSuccess();
}
async function sendResetCode() {
  var email = document.getElementById('forgotEmail').value.trim();
  if (!email) { showForgotError('Ingresá tu email'); return; }
  document.getElementById('forgotSendBtn').disabled = true;
  hideForgotError(); hideForgotSuccess();
  try {
    var r = await fetch(API + '/auth/forgot-password', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email:email})});
    var d = await r.json();
    if (d.success) { showForgotSuccess('Código enviado a tu email'); showForgotStep(2); }
    else { showForgotError(d.error || 'Error al enviar código'); }
  } catch(e) { showForgotError('Error de conexión'); }
  document.getElementById('forgotSendBtn').disabled = false;
}
async function verifyResetCode() {
  var code = document.getElementById('forgotCode').value.trim();
  if (!code || code.length !== 6) { showForgotError('Ingresá el código de 6 dígitos'); return; }
  document.getElementById('forgotVerifyBtn').disabled = true;
  hideForgotError(); hideForgotSuccess();
  try {
    var r = await fetch(API + '/auth/verify-reset-code', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:code})});
    var d = await r.json();
    if (d.success) { _forgotCode = code; showForgotSuccess('Código verificado'); showForgotStep(3); }
    else { showForgotError(d.error || 'Código inválido'); }
  } catch(e) { showForgotError('Error de conexión'); }
  document.getElementById('forgotVerifyBtn').disabled = false;
}
async function resetPassword() {
  var pass = document.getElementById('forgotNewPass').value;
  var pass2 = document.getElementById('forgotNewPass2').value;
  if (!pass || pass.length < 6) { showForgotError('La contraseña debe tener al menos 6 caracteres'); return; }
  if (pass !== pass2) { showForgotError('Las contraseñas no coinciden'); return; }
  document.getElementById('forgotResetBtn').disabled = true;
  hideForgotError(); hideForgotSuccess();
  try {
    var r = await fetch(API + '/auth/verify-reset-code', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({code:_forgotCode, new_password:pass})});
    var d = await r.json();
    if (d.success) { showForgotSuccess('Contraseña cambiada. Redirigiendo...'); setTimeout(function(){ window.location.href = '/login'; }, 1000); }
    else { showForgotError(d.error || 'Error al cambiar contraseña'); }
  } catch(e) { showForgotError('Error de conexión'); }
  document.getElementById('forgotResetBtn').disabled = false;
}
fetch(API + '/auth/me', {credentials: 'include'}).then(function(r){return r.json();}).then(function(d){if(d.authenticated)window.location.href='/app/';}).catch(function(){});
</script>
</body>
</html>
